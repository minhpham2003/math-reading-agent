name: Publish Implementation 2 preview
on:
  push:
    branches:
      - implementation/02-ai-chat
    paths:
      - 'app/**'
      - '.github/workflows/ai-chat-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-ai-chat-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: app
        run: npm install
      - name: Typecheck and build
        working-directory: app
        env:
          VITE_AI_API_URL: https://higher-math-chat-api-oil4.onrender.com
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: npm run build
      - name: Publish isolated preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./app/dist
          destination_dir: previews/ai-chat
          keep_files: true
          enable_jekyll: false
      - name: Preview address
        run: echo "https://${{ github.repository_owner }}.github.io/math-reading-agent/previews/ai-chat/"
